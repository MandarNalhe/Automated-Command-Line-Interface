<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AuCLI</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-lime-200 via-green-300 to-olive-400 flex flex-col text-black">

<!-- Header -->
<header class="border-b-4 border-black bg-lime-300">
    <div class="max-w-4xl mx-auto px-6 py-4">
        <h1 class="text-2xl font-extrabold tracking-tight">AuCLI</h1>
        <p class="text-sm font-semibold">MCP-based CLI Automation Tool</p>
    </div>
</header>

<!-- Main -->
<main class="flex-1 flex flex-col items-center justify-center px-6 py-12">
    <div class="w-full max-w-4xl">

        <div id="welcome" class="text-center mb-12">
            <h2 class="text-5xl font-black uppercase mb-4">
                Welcome to AuCLI
            </h2>
            <p class="text-lg font-bold">Automate anything, command everything</p>
            <p class="text-sm mt-4 font-medium">
                Your intelligent CLI automation assistant powered by MCP
            </p>
        </div>

        <div id="messages" class="mb-8 space-y-4 max-h-[60vh] overflow-y-auto"></div>

        <!-- Input -->
        <div class="bg-white border-4 border-black shadow-[6px_6px_0px_black]">
            <div class="flex items-end gap-2 p-4">
                <textarea
                        id="userInput"
                        placeholder="Enter your CLI command or question..."
                        class="flex-1 bg-transparent resize-none outline-none font-mono min-h-[24px]"
                ></textarea>

                <button
                        id="sendBtn"
                        class="px-4 py-2 bg-green-600 text-white border-2 border-black font-bold shadow-[3px_3px_0px_black] hover:translate-x-[2px] hover:translate-y-[2px] hover:shadow-none transition-all"
                >
                    SEND
                </button>
            </div>

            <div class="px-4 pb-3 text-xs font-semibold">
                ENTER = send | SHIFT+ENTER = newline
            </div>
        </div>
    </div>
</main>

<!-- Footer -->
<footer class="border-t-4 border-black bg-lime-300">
    <div class="max-w-4xl mx-auto px-6 py-4 text-center text-sm font-bold">
        AuCLI © 2025
    </div>
</footer>

<script>
    lucide.createIcons();

    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const messagesDiv = document.getElementById('messages');
    const welcome = document.getElementById('welcome');

    let isProcessing = false;

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text || isProcessing) return;

      welcome.style.display = 'none';
      addUserMessage(text);
      userInput.value = '';
      isProcessing = true;
      addProcessing();

      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: text })
        });

        const data = await res.json();
        removeProcessing();

        if (data.status === 'requires_confirmation') {
            addConfirmationMessage(data);
        } else {
            addAssistantMessage(data.message || JSON.stringify(data), data.status);
        }
      } catch (err) {
        removeProcessing();
        addAssistantMessage('❌ Error: ' + err.message, 'error');
      }

      isProcessing = false;
    }

    async function executePlan(plan) {
      isProcessing = true;
      addProcessing();
      try {
        const res = await fetch('/api/execute', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(plan)
        });
        const data = await res.json();
        removeProcessing();
        addAssistantMessage(data.message || JSON.stringify(data), data.status);
      } catch (err) {
        removeProcessing();
        addAssistantMessage('❌ Error: ' + err.message, 'error');
      }
      isProcessing = false;
    }

    /* Messages */

    function addUserMessage(text) {
      const msg = document.createElement('div');
      msg.className = 'flex justify-end';
      msg.innerHTML = `
        <div class="bg-green-400 border-4 border-black px-4 py-3 max-w-[80%] shadow-[5px_5px_0px_black]">
          <p class="font-mono">${text}</p>
          <span class="text-xs font-bold block mt-1">${new Date().toLocaleTimeString()}</span>
        </div>`;
      messagesDiv.appendChild(msg);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function addAssistantMessage(text, status = 'success') {
      const msg = document.createElement('div');
      msg.className = 'flex justify-start';
      msg.innerHTML = `
        <div class="bg-white border-4 border-black px-4 py-3 max-w-[80%] shadow-[5px_5px_0px_black]">
          <div class="flex items-center gap-2 mb-2 font-bold">
            <span>AuCLI Output</span>
            ${
              status === 'success'
                ? '<span>✔</span>'
                : '<span>✖</span>'
            }
          </div>
          <pre class="font-mono text-sm whitespace-pre-wrap">${text}</pre>
          <span class="text-xs font-bold block mt-2">${new Date().toLocaleTimeString()}</span>
        </div>`;
      messagesDiv.appendChild(msg);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function addConfirmationMessage(data) {
      const msg = document.createElement('div');
      msg.className = 'flex justify-start w-full';

      const uniqueId = 'conf_' + Date.now();

      msg.innerHTML = `
        <div class="bg-red-400 border-4 border-black px-5 py-4 max-w-[90%] shadow-[6px_6px_0px_black]">
          <div class="font-black text-lg mb-3">CONFIRMATION REQUIRED</div>
          <div class="font-mono text-sm mb-4 bg-white border-2 border-black p-2">${data.message}</div>
          <div class="flex gap-3 mt-4" id="${uniqueId}_buttons">
            <button id="${uniqueId}_proceed" class="px-4 py-2 bg-black text-white font-bold border-2 border-black shadow-[3px_3px_0px_white]">PROCEED</button>
            <button id="${uniqueId}_abort" class="px-4 py-2 bg-white text-black font-bold border-2 border-black shadow-[3px_3px_0px_black]">ABORT</button>
          </div>
        </div>`;
      messagesDiv.appendChild(msg);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;

      document.getElementById(`${uniqueId}_proceed`).addEventListener('click', () => {
          document.getElementById(`${uniqueId}_buttons`).style.display = 'none';
          executePlan(data.plan);
      });

      document.getElementById(`${uniqueId}_abort`).addEventListener('click', () => {
          document.getElementById(`${uniqueId}_buttons`).style.display = 'none';
          addAssistantMessage('❌ Operation aborted by user.', 'error');
      });
    }

    function addProcessing() {
      const proc = document.createElement('div');
      proc.id = 'processing';
      proc.className = 'flex justify-start';
      proc.innerHTML = `
        <div class="bg-yellow-300 border-4 border-black px-4 py-2 shadow-[4px_4px_0px_black] font-bold">
          Processing...
        </div>`;
      messagesDiv.appendChild(proc);
    }

    function removeProcessing() {
      const proc = document.getElementById('processing');
      if (proc) proc.remove();
    }

    /* Events */

    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
</script>
</body>
</html>
